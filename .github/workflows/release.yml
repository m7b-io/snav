name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  goreleaser:
    runs-on:
      group: m7b-squid
      labels: m7b-macos-arm64
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load release secrets
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2
        with:
          export-env: true
          version: 2.39.0
        env:
          OP_CONNECT_HOST: https://vault.m7b.io
          OP_CONNECT_TOKEN: ${{ secrets.VAULT_SNAV_RELEASE }}
          MACOS_NOTARY_ISSUER_ID: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/55920b96f36b46346238a5c4
          MACOS_NOTARY_KEY_B64: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/2lwkyaxzpw5khtu25jub6sji7m
          MACOS_NOTARY_KEY_ID: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/a51ddac6cefce03cd8e437af
          MACOS_SIGN_P12: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/xnvhe5mawjt3cvqibum3cv6zga
          MACOS_SIGN_PASSWORD: op://n4bct6bnrutlzyhixr2vszfo34/z7xr4455ovgfqz4v33njk7znfi/c0669fbb8623da8f934a2477

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: src/go.mod
          cache: false

      - name: Cache Go release artifacts
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/Library/Caches/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-release-go-${{ hashFiles('src/go.mod', 'src/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-release-go-

      - name: Setup release tools
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151
        with:
          cache: false
          install_args: zig ripgrep

      - name: Resolve macOS SDK
        run: echo "SDK_PATH=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003

      - name: Setup GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
